spring:
  application:
    name: socialhub-backend
  
  # MongoDB Configuration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/socialhub}
      auto-index-creation: true
  
  # Security
  security:
    user:
      name: admin
      password: admin123

# App Configuration
app:
  jwtSecret: ${JWT_SECRET:mySecretKeyForSocialHubJWTTokenGenerationAndValidation123456789}
  jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

# Logging
logging:
  level:
    root: INFO
    com.socialhub: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.mongodb: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mongo:
      enabled: true

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: true
