spring:
  application:
    name: socialhub-backend
  
  # MongoDB Configuration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/socialhub}
      auto-index-creation: true
  
  # Security
  security:
    user:
      name: admin
      password: admin123

  # Spring Mail Configuration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtp}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# App Configuration
app:
  jwtSecret: ${JWT_SECRET}
  jwtExpirationMs: ${JWT_EXPIRATION_MS:1800000}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@socialhub.local}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

# WebRTC ICE Configuration
webrtc:
  stun:
    urls: ${WEBRTC_STUN_URLS:stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
  turn:
    urls: ${WEBRTC_TURN_URLS:}
    username: ${WEBRTC_TURN_USERNAME:}
    credential: ${WEBRTC_TURN_CREDENTIAL:}

# Server Configuration
server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  tomcat:
    max-http-form-post-size: 52428800
    max-swallow-size: 52428800
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

# File Upload Configuration
file:
  upload:
    dir: uploads
    base-url: http://localhost:8080/uploads

# Logging
logging:
  level:
    root: INFO
    com.socialhub: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.mongodb: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mongo:
      enabled: true

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: true
